name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: 1.12.0

      - name: Build
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          ./gradlew :core:assembleRelease

      - name: Collect artifact
        run: |
          aar="$(find core/build/outputs/aar -name '*.aar' | head -n1)"
          test -n "$aar"
          cp "$aar" Bugcordhook.aar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bugcordhook
          if-no-files-found: error
          path: Bugcordhook.aar

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(grep -oP '^version = "\K[^"]+' core/build.gradle.kts | head -n1)"
          test -n "$version"
          gh release delete "$version" --cleanup-tag --yes || true
          gh release create "$version" Bugcordhook.aar \
            --title "Bugcordhook $version" \
            --notes "Built from $GITHUB_SHA"
